version: "3.8"

networks:
  mongo-express_mongo_net:
    external: true

services:
  nest_app:
    build: .
    container_name: nest_app_auth-ms
    restart: unless-stopped
    ports:
      - "3010:3010"
      - "0.0.0.0:3011:3011"
    volumes:
      - /opt/cert/apps/auth-ms:/opt/cert/apps/auth-ms:ro
    env_file:
      - .env
    networks:
      - mongo-express_mongo_net

name: Rollback backend auth-ms to Last Stable Commit

on:
  workflow_dispatch:

jobs:
  rollback:
    name: Rollback backend-auth-ms
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to remote server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # Cargar bashrc por si hay variables personalizadas
            source ~/.bashrc

            # Navegar al directorio del proyecto
            cd /opt/auth-ms

            # Verificar si existe el archivo de marca
            if [ ! -f .last_stable_commit ]; then
              echo "❌ Error: No se encontró el archivo '.last_stable_commit'. No hay un punto de restauración guardado."
              exit 1
            fi

            LAST_COMMIT=$(cat .last_stable_commit)
            echo "⚠️ Iniciando rollback al commit estable: $LAST_COMMIT"

            # 1. Checkout al commit estable guardado
            git checkout $LAST_COMMIT

            # 2. Reconstruir y levantar los contenedores estables
            docker compose down --volumes --remove-orphans
            docker image prune -a -f
            docker compose pull
            docker compose build --no-cache
            docker compose up -d --remove-orphans

            # 3. Volver a dejar apuntado el HEAD a la rama principal (para que los siguientes deploys funcionen sin problemas)
            git checkout ${{ secrets.MAIN_BRANCH }}

            echo "✅ Rollback completado con éxito a la versión estable anterior."
